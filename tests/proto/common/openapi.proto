syntax = "proto3";

package common;

import "protoc-gen-openapiv2/options/annotations.proto";

// openapiv2_swagger 定义合并文档的全局信息；
// 生成时该文件作为 leader，openapi.swagger.yaml 的全局字段由此提供
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Go SDK Server API";
    version: "1.0.0";
    description: "go-sdk/server 示例服务的 HTTP API 文档，"
      "由 grpc-gateway 在同一端口同时提供 HTTP API 与原生 gRPC。"
      "成功响应统一将 Protobuf 消息包装在 data 字段下；"
      "失败响应包含 code、message、domain、reason 和 details。";
    contact: {
      name: "go-sdk/server";
      url: "https://github.com/go-sdk/server";
    };
  };
  // 未配置证书时为 HTTP，配置证书后为 HTTPS
  schemes: [HTTP, HTTPS];
  consumes: "application/json";
  produces: "application/json";
  security_definitions: {
    security: {
      key: "BearerJWT";
      value: {
        type: TYPE_API_KEY;
        description: "JWT Bearer Token，格式：Bearer <token>。"
          "仅在使用 WithJWTSecret 配置密钥后启用；"
          "方法设置 skip_auth 的接口不需要。";
        name: "Authorization";
        in: IN_HEADER;
      };
    };
  };
  // 示例服务启用了 JWT 鉴权，全部接口默认要求携带 Token
  security: {
    security_requirement: {
      key: "BearerJWT";
      value: {};
    };
  };
};
