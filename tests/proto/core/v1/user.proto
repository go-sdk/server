syntax = "proto3";

package core.v1;

import "buf/validate/validate.proto";
import "common/common.proto";
import "options/options.proto";

// 用户
message User {
  // Id
  string id = 1;
  // 用户名
  string name = 2;
  // 邮箱
  string email = 3 [(server.options.field).sensitive = true];

  // 元数据
  server.common.Metadata metadata = 15;
}

message CreateUserReq {
  // 用户名
  string name = 2 [(buf.validate.field).string = {min_len: 1}];
  // 邮箱
  string email = 3 [
    (buf.validate.field).string = {min_len: 1},
    (server.options.field).sensitive = true
  ];
}

message Credentials {
  option (server.options.message).sensitive = true;

  string token = 1;
}
