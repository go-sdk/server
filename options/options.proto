syntax = "proto3";

package server.options;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MethodOptions {
  MethodOptions method = 202609129;
}

// 方法选项
message MethodOptions {
  // 是否跳过认证
  bool skip_auth = 1;
  // 权限标识
  repeated string permissions = 2;
  // 是否跳过日志
  bool skip_log = 3;
  // 审计类型；非空时调用业务注入的审计方法
  string audit_kind = 4;
}

extend google.protobuf.MessageOptions {
  MessageOptions message = 202609128;
}

// 消息选项
message MessageOptions {
  // 是否将整个消息作为敏感数据
  bool sensitive = 1;
}

extend google.protobuf.FieldOptions {
  FieldOptions field = 202609127;
}

// 字段选项
message FieldOptions {
  // 是否敏感字段
  bool sensitive = 1;
}

extend google.protobuf.EnumValueOptions {
  EnumValueOptions enum_value = 202609126;
}

// 枚举值选项
message EnumValueOptions {
  // --- ErrorCode ---

  // HandlePath 错误响应使用的 HTTP 状态码
  int32 http_status = 1;
  // 英文默认错误文案，支持 Go text/template 变量
  string message = 2;
}
