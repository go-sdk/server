# yaml-language-server: $schema=https://www.schemastore.org/buf.json

# Buf Workspace v2：单文件统一管理多个模块的依赖、lint 与兼容性检查
version: v2
modules:
  # 对外发布的公共模块，includes 内的 Proto 统一发布到同一 BSR 仓库；
  # 新增公共 Proto 目录时同步追加 includes，tag CI 会自动发布整个命名模块
  - path: .
    name: buf.build/go-sdk/server
    includes:
      - options
      - common
  # 测试与示例协议模块，包含 google.api.http 注解和 buf.validate 规则
  - path: tests/proto
# 远程依赖，具体版本由 buf.lock 锁定；生成时下载到本地镜像
deps:
  # google.api.http 注解和 google.rpc 错误详情
  - buf.build/googleapis/googleapis
  # buf.validate 字段校验规则，由 Protovalidate interceptor 执行
  - buf.build/bufbuild/protovalidate
  # openapiv2_swagger 扩展选项，由 openapi.proto 定义合并文档的 title 和 version
  - buf.build/grpc-ecosystem/grpc-gateway
lint:
  use:
    - STANDARD
  except:
    # 请求/响应消息统一使用 Req/Resp 后缀
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
    # 请求/响应可以使用相同的名称
    - RPC_REQUEST_RESPONSE_UNIQUE
  ignore_only:
    # common 包承载跨服务通用类型，不按服务版本化；options 为基础库公共选项包
    PACKAGE_VERSION_SUFFIX:
      - options/options.proto
      - common/common.proto
      - tests/proto/common/openapi.proto
    # proto 包为 server.options，不含模块目录，文件位于模块根
    PACKAGE_DIRECTORY_MATCH:
      - options/options.proto
      - common/common.proto
    IMPORT_NO_PUBLIC:
      - common/common.proto
breaking:
  # 以文件为单位检查破坏性变更，与生成代码的文件布局保持一致
  use:
    - FILE
